<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>3D 지구 지형 모델링</title>

    <script id="vertex-shader" type="x-shader/x-vertex">
        attribute vec3 vPosition;
        attribute vec3 vNormal;
        attribute vec2 vTexCoord;

        uniform mat4 modelViewMatrix;
        uniform mat4 projectionMatrix;
        uniform mat3 normalMatrix;
        uniform vec4 lightPosition;

        varying vec3 N, L, E;
        varying vec2 fTexCoord;

        void main() {
            vec3 pos = (modelViewMatrix * vec4(vPosition, 1.0)).xyz;
            L = normalize(lightPosition.xyz - pos);
            E = normalize(-pos);
            N = normalize(normalMatrix * vNormal);

            fTexCoord = vTexCoord;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(vPosition, 1.0);
        }
    </script>

    <script id="fragment-shader" type="x-shader/x-fragment">
        precision mediump float;

        uniform vec4 ambientProduct;
        uniform vec4 diffuseProduct;
        uniform vec4 specularProduct;
        uniform float shininess;
        uniform sampler2D texture;

        varying vec3 N, L, E;
        varying vec2 fTexCoord;

        void main() {
            vec3 n = normalize(N);
            vec3 l = normalize(L);
            vec3 e = normalize(E);
            vec3 h = normalize(l + e);

            vec4 texColor = texture2D(texture, fTexCoord);
            vec4 ambient = ambientProduct * texColor;
            vec4 diffuse = max(dot(l, n), 0.0) * diffuseProduct * texColor;

            float ks = pow(max(dot(n, h), 0.0), shininess);
            vec4 specular = (dot(l, n) > 0.0) ? ks * specularProduct : vec4(0.0);

            vec4 fColor = ambient + diffuse + specular;
            fColor.a = 1.0;
            gl_FragColor = fColor;
        }
    </script>
</head>
<body>
    <canvas id="gl-canvas" width="512" height="512">
        canvas
    </canvas>

    <div style="margin-top: 10px;">
        <button id="btn-spin">자전 정지</button>
        자전 속도: <input id="spin-speed" type="range" min="0" max="2" step="0.1" value="0.5">
        고도 배율: <input id="height-scale" type="range" min="0" max="0.3" step="0.05" value="0.1">
    </div>

    <div style="margin-top: 10px;">
        <input id="full-light" type="checkbox"> 조명 전체 ON
        <input id="auto-light" type="checkbox" checked> 조명 이동
    </div>

    <div style="margin-top: 10px;">
        조명 각도: <input id="light-angle" type="range" min="0" max="360" step="1" value="0">
    </div>

    <script src="webgl-utils.js"></script>
    <script src="initShaders.js"></script>
    <script src="MV.js"></script>
    <script src="earthData.js"></script>
    <script src="earthTexture.js"></script>
    <script src="app.js"></script>
</body>
</html>
