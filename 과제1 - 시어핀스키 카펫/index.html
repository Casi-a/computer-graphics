<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Sierpinski Carpet - 진광</title>
    
    <script id="vertex-shader" type="x-shader/x-vertex">
        attribute vec4 vPosition;
        void main() {
            gl_Position = vPosition;
        }
    </script>

    <script id="fragment-shader" type="x-shader/x-fragment">
        precision mediump float;
        uniform vec4 fColor;
        void main() {
            gl_FragColor = fColor;
        }
    </script>
</head>
<body>
    <canvas id="gl-canvas" width="512" height="512">
        브라우저가 HTML5 canvas 요소를 지원하지 않습니다.
    </canvas>
    
    <div style="margin-top: 10px;">
        분할 횟수: 0 <input id="slider" type="range" min="0" max="5" step="1" value="0" /> 5
    </div>
    
    <div style="margin-top: 10px;">
        색상 선택: <input id="color-picker" type="color" value="#ff0000">
    </div>

    <script src="app.js"></script>
</body>
</html>
